<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nightmare Road-ET · 服务端出图窗口</title>
<style>
:root{--bg:#0a1020;--line:rgba(255,255,255,.14);--txt:#eef3ff;--mut:#9fb0cf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 80% -10%,#1b2b52,transparent 60%),var(--bg);color:var(--txt);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:24px 18px 44px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#151f38,#0e1730);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 6px}
textarea,input,select{width:100%;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;background:#fff;color:#0a1020;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tab{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);cursor:pointer;font-size:14px;color:var(--mut)}
.tab.on{background:#fff;color:#0a1020;font-weight:700;border-color:#fff}
.drop{margin-top:4px;border:1.5px dashed rgba(255,255,255,.25);border-radius:12px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;font-size:13px}
.drop img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f59e0b;margin-right:8px}
.dot.ok{background:#22c55e}.dot.bad{background:#ef4444}
.out{margin-top:14px;min-height:240px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden;position:relative;flex-wrap:wrap;gap:10px;padding:8px}
.out img{max-width:100%;max-height:520px;display:block;border-radius:8px}
.err{margin-top:12px;display:none;background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.4);border-radius:12px;padding:12px;color:#ffc9c9;white-space:pre-wrap;word-break:break-word;font-size:13px}
.err .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.copy{background:#fff;color:#0a1020;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:r 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Nightmare Road-ET · 服务端出图窗口</h1>
  <div class="sub"><span id="dot" class="dot"></span><span id="st">连接中…</span>　<span id="meta"></span></div>
  <div class="grid">
    <div class="card">
      <div class="tabs"><div class="tab on" data-mode="txt2img">文生图</div><div class="tab" data-mode="img2img">图生图 / 上传改图</div></div>
      <label>提示语（正向）</label>
      <textarea id="prompt" rows="4">masterpiece, best quality, highly detailed, sharp focus, cinematic lighting</textarea>
      <label>反向提示语</label>
      <textarea id="neg" rows="3">lowres, worst quality, low quality, blurry, jpeg artifacts, bad anatomy, bad hands, bad proportions, extra fingers, extra limbs, watermark, text, signature</textarea>
      <div id="imgwrap" style="display:none">
        <label>上传图片（作为图生图底图）</label>
        <div class="drop" id="drop">点击选择图片，或把图片拖进来<input id="file" type="file" accept="image/*" hidden /></div>
      </div>
      <div class="out" id="out"><span>生成结果会显示在这里</span></div>
      <div class="err" id="err"><div class="bar"><strong>生成失败</strong><button class="copy" onclick="copyErr()">复制错误</button></div><div id="errText"></div></div>
    </div>
    <div class="card">
      <label>步数 steps</label><input id="steps" type="number" min="1" max="150" value="20" />
      <label>CFG</label><input id="cfg" type="number" min="1" max="30" step="0.5" value="7" />
      <div class="row"><div><label>宽 width</label><input id="w" type="number" min="64" max="2048" step="64" value="512" /></div>
        <div><label>高 height</label><input id="h" type="number" min="64" max="2048" step="64" value="512" /></div></div>
      <div class="row"><div><label>批量 batch</label><input id="batch" type="number" min="1" max="8" value="1" /></div>
        <div><label>种子 seed（0=随机）</label><input id="seed" type="number" value="0" /></div></div>
      <div id="strwrap" style="display:none"><label>重绘幅度 denoise</label><input id="strength" type="number" min="0.05" max="1" step="0.05" value="0.6" /></div>
      <label>采样器 sampler</label>
      <select id="sampler"><option value="dpm++2m" selected>DPM++ 2M（质量优先）</option><option value="euler_a">Euler a（速度快）</option><option value="euler">Euler</option><option value="heun">Heun</option></select>
      <button class="btn" id="go" onclick="gen()" disabled>生成图片</button>
      <div class="sub" id="tip" style="margin-top:10px">引擎就绪后才能生成，Key 已自动填入。</div>
    </div>
  </div>
</div>
<script>
var API_KEY = "__APIKEY__";
var mode = "txt2img", initB64 = "", ready = false, lastErr = "";
function $(id){ return document.getElementById(id); }
function copyErr(){ if(lastErr) navigator.clipboard.writeText(lastErr).catch(function(){}); }
function showErr(text){ lastErr = text; $("errText").textContent = text; $("err").style.display = "block"; }
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    mode = t.dataset.mode;
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === t); });
    $("imgwrap").style.display = mode === "img2img" ? "block" : "none";
    $("strwrap").style.display = mode === "img2img" ? "block" : "none";
  };
});
$("drop").onclick = function(){ $("file").click(); };
$("drop").addEventListener("dragover", function(e){ e.preventDefault(); });
$("drop").addEventListener("drop", function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
$("file").onchange = function(){ if(this.files[0]) readFile(this.files[0]); };
function readFile(f){
  var r = new FileReader();
  r.onload = function(){
    initB64 = String(r.result).split(",")[1] || "";
    $("drop").innerHTML = '<img src="' + r.result + '"><div style="font-size:12px;color:#9fb0cf">已载入：' + f.name + '（点击可更换）</div>';
    $("drop").appendChild($("file"));
  };
  r.readAsDataURL(f);
}
function poll(){
  fetch("/healthz", {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    ready = (j.status === "ready" || j.status === "busy");
    $("dot").className = "dot " + (ready ? "ok" : (j.status === "engine_missing" ? "bad" : ""));
    $("st").textContent = ready ? "引擎就绪" : (j.status === "engine_missing" ? "引擎缺失（见控制台）" : (j.status === "loading" ? "模型加载中…" : "启动中…"));
    $("meta").textContent = "模型：" + (j.model || "(未选择)") + "　重启：" + (j.engine_restarts != null ? j.engine_restarts : "?") + "　已加载：" + (j.load_elapsed_s || 0) + "s";
    $("go").disabled = !ready;
    $("tip").textContent = ready ? "可以生成" : "引擎就绪后才能生成（大模型首次加载可能需要几分钟）";
  }).catch(function(){ $("dot").className = "dot bad"; $("st").textContent = "无法连接服务"; ready = false; $("go").disabled = true; });
}
poll(); setInterval(poll, 2500);
async function gen(){
  var btn = $("go"), out = $("out");
  $("err").style.display = "none";
  if(mode === "img2img" && !initB64){ showErr("图生图需要先上传一张图片"); return; }
  btn.disabled = true;
  var t0 = Date.now();
  out.innerHTML = '<span><span class="spin"></span><span id="el">正在生成…</span><br><span id="eta" style="font-size:12px;color:#9fb0cf"></span></span>';
  var mp = (+$("w").value) * (+$("h").value) / 1e6;
  var steps = +$("steps").value;
  var rate = parseFloat(localStorage.getItem("ld.secPerStepMP") || "0") || 0.9;
  var estTotal = Math.max(3, rate * steps * Math.max(mp, 0.05));
  var timer = setInterval(function(){
    var el = $("el"), eta = $("eta");
    var spent = (Date.now() - t0) / 1000;
    if(el) el.textContent = "正在生成… " + Math.floor(spent) + "s";
    if(eta){
      var left = estTotal - spent;
      eta.textContent = left > 1 ? "预计还需 " + Math.ceil(left) + "s（按本机历史速度）" : "已超过估算，仍在生成…";
    }
  }, 1000);
  try{
    var body = {
      prompt: $("prompt").value,
      negative_prompt: $("neg").value,
      steps: steps,
      cfg_scale: +$("cfg").value,
      width: +$("w").value,
      height: +$("h").value,
      seed: +$("seed").value,
      batch_size: +$("batch").value,
      sampler_name: $("sampler").value
    };
    if(mode === "img2img"){
      body.init_images = [initB64];
      body.denoising_strength = +$("strength").value;
    }
    var r = await fetch("/sdapi/v1/" + mode, {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer " + API_KEY}, body: JSON.stringify(body)});
    var text = await r.text();
    var j = {}; try{ j = JSON.parse(text); }catch(e){}
    if(r.ok && j.images && j.images.length){
      out.innerHTML = "";
      j.images.forEach(function(b64){ var img = new Image(); img.src = "data:image/png;base64," + b64; out.appendChild(img); });
      var meta = document.createElement("div");
      meta.style.cssText = "width:100%;text-align:right;font-size:12px;color:#9fb0cf";
      var spent = (Date.now() - t0) / 1000;
      meta.textContent = "用时 " + spent.toFixed(1) + "s";
      out.appendChild(meta);
      if(steps > 0 && mp > 0){
        var measured = spent / (steps * Math.max(mp, 0.05));
        if(measured > 0.05 && measured < 60) localStorage.setItem("ld.secPerStepMP", measured.toFixed(4));
      }
    }else{
      out.innerHTML = '<span>生成失败，错误已显示在下方，可一键复制</span>';
      showErr("HTTP " + r.status + "\n" + (text || JSON.stringify(j, null, 2)));
    }
  }catch(e){
    out.innerHTML = '<span>请求失败</span>';
    showErr("network: " + e);
  }finally{
    clearInterval(timer); btn.disabled = !ready;
  }
}
</script>
</body>
</html>
